[package]
name = "callxl-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CallXL desktop app (Slint): private peer-to-peer encrypted voice chat"
build = "build.rs"

[lib]
name = "callxl_desktop"
path = "src/lib.rs"

[[bin]]
name = "callxl"
path = "src/main.rs"

[dependencies]
callxl-core = { workspace = true }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "system-tray", "unstable-winit-030"] }

notify-rust = "4.18"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
interprocess = "2.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_Foundation"] }

[dev-dependencies]
png = "0.18"

[build-dependencies]
slint-build = "=1.18.1"
serde_json = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# `cargo deb -p callxl-desktop` → target/debian/callxl_<version>_amd64.deb (CLAUDE.md §8).
# Runtime libraries libwebrtc and winit load with dlopen (PulseAudio/ALSA, X11/Wayland,
# xkbcommon, OpenGL/EGL, fontconfig) are listed explicitly; `$auto` adds the linked ones.
[package.metadata.deb]
name = "callxl"
maintainer = "CallXL <callxl@users.noreply.github.com>"
copyright = "CallXL contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
CallXL is a private, peer-to-peer, end-to-end encrypted voice chat with text chat and \
file transfer. Calls on the same network work with no internet and no servers."""
section = "net"
priority = "optional"
revision = ""
depends = "$auto, libpulse0, libasound2t64 | libasound2, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2, libwayland-client0, libwayland-egl1, libwayland-cursor0, libegl1, libgl1, libfontconfig1, libdbus-1-3"
recommends = "pipewire-pulse | pulseaudio, xdg-desktop-portal"
assets = [
    ["target/release/callxl", "usr/bin/", "755"],
    ["../../packaging/linux/callxl.desktop", "usr/share/applications/", "644"],
    ["../../design/icons/callxl.svg", "usr/share/icons/hicolor/scalable/apps/callxl.svg", "644"],
    ["../../design/icons/png/callxl-16.png", "usr/share/icons/hicolor/16x16/apps/callxl.png", "644"],
    ["../../design/icons/png/callxl-24.png", "usr/share/icons/hicolor/24x24/apps/callxl.png", "644"],
    ["../../design/icons/png/callxl-32.png", "usr/share/icons/hicolor/32x32/apps/callxl.png", "644"],
    ["../../design/icons/png/callxl-48.png", "usr/share/icons/hicolor/48x48/apps/callxl.png", "644"],
    ["../../design/icons/png/callxl-64.png", "usr/share/icons/hicolor/64x64/apps/callxl.png", "644"],
    ["../../design/icons/png/callxl-128.png", "usr/share/icons/hicolor/128x128/apps/callxl.png", "644"],
    ["../../design/icons/png/callxl-256.png", "usr/share/icons/hicolor/256x256/apps/callxl.png", "644"],
    ["../../design/icons/png/callxl-512.png", "usr/share/icons/hicolor/512x512/apps/callxl.png", "644"],
]
