[package]
name = "callxl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CallXL core: state machine, call policy, identity/trust, chat, files, diagnostics (UniFFI API)"
build = "build.rs"

[lib]
# cdylib/staticlib are produced on demand with `cargo rustc --crate-type` (see DECISIONS.md)
crate-type = ["lib"]
name = "callxl_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
callxl-media = { workspace = true }
callxl-signal = { workspace = true }
callxl-lan = { workspace = true }
uniffi = "0.29"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
blake3 = { workspace = true }
uuid = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
if-addrs = "0.13"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

[build-dependencies]
rand = { workspace = true }
hex = { workspace = true }
