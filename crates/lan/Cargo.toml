[package]
name = "callxl-lan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CallXL LAN: mDNS discovery (_callxl._tcp.local) + direct TCP signaling"

[dependencies]
callxl-signal = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# Apple targets use the system DNS-SD API (dnssd.rs): iOS forbids raw multicast sockets
# without a restricted entitlement.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
mdns-sd = "0.13"
