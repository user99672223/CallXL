name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CC: clang-21
  CXX: clang++-21
  WEBRTC_TAG: webrtc-a545de4

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: System packages (clang 21 for libwebrtc's hermetic libc++, glib headers, PulseAudio)
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update -q
          sudo apt-get install -y -q clang-21 libglib2.0-dev pkg-config pulseaudio pulseaudio-utils iproute2
          clang++-21 --version

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache prebuilt libwebrtc (${{ env.WEBRTC_TAG }})
        uses: actions/cache@v4
        with:
          path: ~/.cache/callxl/${{ env.WEBRTC_TAG }}
          key: libwebrtc-${{ env.WEBRTC_TAG }}-linux-x64-release

      - name: Fetch libwebrtc (no-op when cached)
        run: scripts/ci-webrtc-cache.sh linux-x64-release

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build callxl-cli and test binaries
        run: |
          cargo build -p callxl-cli
          cargo test --workspace --no-run

      - name: Unit tests
        run: cargo test --workspace --exclude callxl-e2e

      - name: Swift bindings generate on Linux (UniFFI)
        run: |
          set -euo pipefail
          cargo rustc -p callxl-core --lib --crate-type cdylib
          cargo run -q -p callxl-core --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/libcallxl_core.so --language swift --out-dir target/swift-bindings
          ls -l target/swift-bindings
          test -s target/swift-bindings/CallXLCore.swift
          test -s target/swift-bindings/CallXLCoreFFI.h
          test -s target/swift-bindings/CallXLCoreFFI.modulemap

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/worker/package-lock.json

      - name: Worker tests (vitest)
        working-directory: infra/worker
        run: |
          npm ci
          npm test

      - name: e2e (tc netem on lo, as root)
        env:
          CALLXL_NETEM: tc
          CALLXL_E2E_ARTIFACTS: ${{ github.workspace }}/target/e2e-artifacts
        run: |
          set -euo pipefail
          ip -6 addr show dev lo
          sudo ip link set lo multicast on
          # Build as the runner user, run the test executables as root (tc needs CAP_NET_ADMIN).
          mapfile -t BINS < <(cargo test -p callxl-e2e --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable')
          export CALLXL_CLI="$PWD/target/debug/callxl-cli"
          status=0
          for b in "${BINS[@]}"; do
            echo "::group::$(basename "$b")"
            sudo -E env PATH="$PATH" "$b" --test-threads=1 --nocapture || status=1
            echo "::endgroup::"
          done
          sudo chown -R "$(id -u):$(id -g)" target/e2e-artifacts || true
          exit $status

      - name: PulseAudio null sink exercised once (platform ADM)
        env:
          CALLXL_E2E_ADM: platform
          CALLXL_E2E_ARTIFACTS: ${{ github.workspace }}/target/e2e-artifacts-pulse
        run: |
          set -euo pipefail
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=callxl_null
          pactl set-default-sink callxl_null
          pactl set-default-source callxl_null.monitor
          # Speech into the null sink so the platform capture (its monitor) is not silence:
          # with silence VBR Opus sends ~2 kbps and BWE has nothing to grow on (run 42337000540).
          wav="$(ls target/e2e-artifacts/assets/*.wav | head -1)"
          ( while true; do paplay -d callxl_null "$wav" || break; done ) &
          player=$!
          cargo test -p callxl-e2e --test loopback -- loopback_v4_lan_policy --nocapture
          kill "$player" || true

      - name: Upload callxl-cli
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callxl-cli
          path: target/debug/callxl-cli
          if-no-files-found: warn

      - name: Upload e2e logs, recordings, diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            target/e2e-artifacts
            target/e2e-artifacts-pulse
            !target/**/assets
          if-no-files-found: warn

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # Apple clang for the iOS SDK (the workflow-level clang-21 is for Linux).
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Toolchains
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache prebuilt iOS libwebrtc (${{ env.WEBRTC_TAG }})
        uses: actions/cache@v4
        with:
          path: ~/.cache/callxl/${{ env.WEBRTC_TAG }}
          key: libwebrtc-${{ env.WEBRTC_TAG }}-ios-device-arm64-ios-simulator-arm64

      - name: Swift lint, tokens up to date (swiftformat, XcodeGen)
        run: |
          set -euo pipefail
          brew install swiftformat xcodegen
          swiftformat --version
          swiftformat --lint apps/ios
          python3 packaging/ios/gen-tokens.py --check

      - name: Bonjour (DNS-SD) discovery backend on Apple
        run: cargo test -p callxl-lan -- --nocapture

      - name: Build CallXLCore.xcframework + Swift binding
        run: packaging/ios/build-xcframework.sh

      - name: Upload CallXLCore.xcframework
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CallXLCore.xcframework
          path: target/ios/CallXLCore.xcframework.zip
          if-no-files-found: warn

      - name: Generate Xcode project (XcodeGen)
        working-directory: apps/ios
        run: xcodegen generate

      - name: xcodebuild test on an iOS Simulator (bindings, audio session, CallKit, UI smoke)
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")], reverse=True)
          print(next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone")))
          ')"
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          set +e
          xcodebuild test \
            -project apps/ios/CallXL.xcodeproj -scheme CallXL \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath target/ios/DerivedData-test \
            -resultBundlePath target/ios/CallXLTests.xcresult \
            CODE_SIGNING_ALLOWED=NO > target/ios/xcodebuild-test.log 2>&1
          status=$?
          set -e
          grep -E "Test Case|Test Suite|error:|launch-to-home|bindings:|bonjour|Executed|failed" target/ios/xcodebuild-test.log || true
          if [ "$status" -ne 0 ]; then tail -150 target/ios/xcodebuild-test.log; fi
          exit "$status"

      - name: Unsigned IPA
        run: packaging/ios/build-unsigned-ipa.sh

      - name: Upload CallXL-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: CallXL-unsigned.ipa
          path: target/ios/CallXL-unsigned.ipa
          if-no-files-found: error

      - name: Upload Xcode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            target/ios/CallXLTests.xcresult
            target/ios/xcodebuild-test.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Phase 2 adds this job (placeholder, intentionally commented out):
  #
  # windows:
  #   runs-on: windows-latest
  #   steps: checkout · clang/MSVC toolchain · libwebrtc cache (win-x64-release) ·
  #          cargo build (static CRT) · cargo test --workspace --exclude callxl-e2e ·
  #          loopback e2e with the test ADM · Inno Setup → CallXL-Setup.exe ·
  #          silent install/uninstall smoke test · upload CallXL-Setup.exe
  # ---------------------------------------------------------------------------
