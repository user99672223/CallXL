name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  WEBRTC_TAG: webrtc-a545de4

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CC: clang-21
      CXX: clang++-21
    steps:
      - uses: actions/checkout@v4

      - name: System packages (clang 21 for libwebrtc's hermetic libc++, glib headers, PulseAudio, Xvfb + desktop runtime libs)
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update -q
          sudo apt-get install -y -q clang-21 libglib2.0-dev pkg-config pulseaudio pulseaudio-utils iproute2 \
            xvfb xauth libxkbcommon-x11-0 libxkbcommon0 libgl1 libegl1 libgl1-mesa-dri libfontconfig1 \
            libxcursor1 libxi6 libxrandr2 libwayland-client0 libwayland-egl1 libwayland-cursor0 bc
          clang++-21 --version

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache prebuilt libwebrtc (${{ env.WEBRTC_TAG }})
        uses: actions/cache@v4
        with:
          path: ~/.cache/callxl/${{ env.WEBRTC_TAG }}
          key: libwebrtc-${{ env.WEBRTC_TAG }}-linux-x64-release

      - name: Fetch libwebrtc (no-op when cached)
        run: scripts/ci-webrtc-cache.sh linux-x64-release

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build callxl-cli, callxl (desktop) and test binaries
        run: |
          cargo build -p callxl-cli -p callxl-desktop
          cargo test --workspace --no-run

      - name: Unit tests
        run: cargo test --workspace --exclude callxl-e2e

      - name: Swift bindings generate on Linux (UniFFI)
        run: |
          set -euo pipefail
          cargo rustc -p callxl-core --lib --crate-type cdylib
          cargo run -q -p callxl-core --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/libcallxl_core.so --language swift --out-dir target/swift-bindings
          ls -l target/swift-bindings
          test -s target/swift-bindings/CallXLCore.swift
          test -s target/swift-bindings/CallXLCoreFFI.h
          test -s target/swift-bindings/CallXLCoreFFI.modulemap

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/worker/package-lock.json

      - name: Worker tests (vitest)
        working-directory: infra/worker
        run: |
          npm ci
          npm test

      - name: e2e (tc netem on lo, as root)
        env:
          CALLXL_NETEM: tc
          CALLXL_E2E_ARTIFACTS: ${{ github.workspace }}/target/e2e-artifacts
        run: |
          set -euo pipefail
          ip -6 addr show dev lo
          sudo ip link set lo multicast on
          # Build as the runner user, run the test executables as root (tc needs CAP_NET_ADMIN).
          mapfile -t BINS < <(cargo test -p callxl-e2e --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable')
          export CALLXL_CLI="$PWD/target/debug/callxl-cli"
          status=0
          for b in "${BINS[@]}"; do
            echo "::group::$(basename "$b")"
            sudo -E env PATH="$PATH" "$b" --test-threads=1 --nocapture || status=1
            echo "::endgroup::"
          done
          sudo chown -R "$(id -u):$(id -g)" target/e2e-artifacts || true
          exit $status

      - name: PulseAudio null sink exercised once (platform ADM)
        env:
          CALLXL_E2E_ADM: platform
          CALLXL_E2E_ARTIFACTS: ${{ github.workspace }}/target/e2e-artifacts-pulse
        run: |
          set -euo pipefail
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=callxl_null
          pactl set-default-sink callxl_null
          pactl set-default-source callxl_null.monitor
          # Speech into the null sink so the platform capture (its monitor) is not silence:
          # with silence VBR Opus sends ~2 kbps and BWE has nothing to grow on (run 42337000540).
          wav="$(ls target/e2e-artifacts/assets/*.wav | head -1)"
          ( while true; do paplay -d callxl_null "$wav" || break; done ) &
          player=$!
          cargo test -p callxl-e2e --test loopback -- loopback_v4_lan_policy --nocapture
          kill "$player" || true

      - name: Desktop gui_join (GUI joins a callxl-cli peer over real mDNS, under Xvfb)
        env:
          CALLXL_GUI_JOIN_AUDIO: "1"
          CALLXL_E2E_ARTIFACTS: ${{ github.workspace }}/target/e2e-artifacts-gui
        run: |
          set -euo pipefail
          # PulseAudio (started above) gives the GUI's platform audio device a null sink;
          # speech into it so the GUI sends real audio back to the CLI peer.
          wav="$(ls target/e2e-artifacts/assets/*.wav | head -1)"
          ( while true; do paplay -d callxl_null "$wav" || break; done ) &
          player=$!
          apps/desktop/tests/gui_join.sh target/debug/callxl target/debug/callxl-cli
          kill "$player" || true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Desktop release build (fat LTO), .deb, install, startup under 1 s
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cargo build --release -p callxl-desktop
          echo "release build: $(( $(date +%s) - t0 )) s"
          cargo deb -p callxl-desktop --no-build
          deb="$(ls target/debian/callxl_*_amd64.deb)"
          echo "binary: $(stat -c %s target/release/callxl) bytes; package: $(stat -c %s "$deb") bytes ($deb)"
          dpkg -I "$deb"
          dpkg -c "$deb"
          sudo apt-get install -y -q "./$deb"
          dpkg -s callxl | grep -E '^(Version|Depends):'
          desktop-file-validate /usr/share/applications/callxl.desktop 2>/dev/null || true
          test -x /usr/bin/callxl
          callxl --version
          # §14: the app launches under 1 s (measured by the app itself from process
          # start to: window shown + core started). Three launches: cold, then warm.
          for i in 1 2 3; do
            out="$(xvfb-run -a callxl --headless-smoke 2>/dev/null)"
            echo "$out"
            ms="$(echo "$out" | sed -n 's/^startup_ms=//p')"
            echo "$out" | grep -qx ready
            test -n "$ms" && test "$ms" -lt 1000
          done

      - name: Upload callxl .deb
        uses: actions/upload-artifact@v4
        with:
          name: callxl-deb
          path: target/debian/callxl_*_amd64.deb
          if-no-files-found: error

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screens
          path: target/screens
          if-no-files-found: warn

      - name: Upload callxl-cli
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callxl-cli
          path: target/debug/callxl-cli
          if-no-files-found: warn

      - name: Upload e2e logs, recordings, diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            target/e2e-artifacts
            target/e2e-artifacts-pulse
            target/e2e-artifacts-gui
            !target/**/assets
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # MSVC is found by cc-rs/rustc through the VS installation (no CC/CXX, no vcvars:
      # vcvars puts link.exe behind Git Bash's /usr/bin/link). Static CRT (§8).
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache prebuilt libwebrtc (${{ env.WEBRTC_TAG }})
        uses: actions/cache@v4
        with:
          path: ~/.cache/callxl/${{ env.WEBRTC_TAG }}
          key: libwebrtc-${{ env.WEBRTC_TAG }}-win-x64-release

      - name: Fetch libwebrtc (no-op when cached)
        run: scripts/ci-webrtc-cache.sh win-x64-release

      - name: Build callxl-cli and test binaries
        run: |
          cargo build -p callxl-cli -p callxl-desktop
          cargo test --workspace --no-run

      - name: Unit tests
        run: cargo test --workspace --exclude callxl-e2e

      - name: Loopback e2e with the test ADM (127.0.0.1, LAN policy)
        env:
          CALLXL_E2E_ARTIFACTS: ${{ github.workspace }}/target/e2e-artifacts
        run: |
          export CALLXL_CLI="$PWD/target/debug/callxl-cli.exe"
          cargo test -p callxl-e2e --test loopback -- loopback_v4_lan_policy --nocapture

      - name: Release build (static CRT, fat LTO)
        run: |
          t0=$(date +%s)
          cargo build --release -p callxl-desktop
          echo "release build: $(( $(date +%s) - t0 )) s"
          ls -l target/release/callxl.exe
          target/release/callxl.exe --version
          # Static CRT: no vcruntime/msvcp import.
          if command -v dumpbin >/dev/null; then dumpbin //dependents target/release/callxl.exe; fi

      - name: Inno Setup → CallXL-Setup.exe
        run: |
          set -euo pipefail
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [[ ! -x "$ISCC" ]]; then
            choco install innosetup -y --no-progress
          fi
          ver="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="callxl-desktop") | .version')"
          "$ISCC" //Qp "//DAppVersion=$ver" "//DBinDir=$(cygpath -w "$PWD/target/release")" \
            "//DOutDir=$(cygpath -w "$PWD/target/installer")" packaging/windows/callxl.iss
          ls -l target/installer/CallXL-Setup.exe

      - name: Silent install / launch / uninstall smoke test
        run: |
          set -euo pipefail
          target/installer/CallXL-Setup.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //LOG=install.log
          app="$(cygpath -u "$LOCALAPPDATA")/Programs/CallXL"
          ls -l "$app"
          test -f "$app/callxl.exe"
          lnk="$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/CallXL.lnk"
          test -f "$lnk" && echo "Start menu shortcut: $lnk"
          v="$("$app/callxl.exe" --version)"
          echo "$v"
          [[ "$v" == callxl* ]]
          "$app/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          # The uninstaller hands off to a temporary copy and returns at once: wait for it.
          for _ in $(seq 60); do [[ -e "$app" ]] || break; sleep 1; done
          if [[ -e "$app" ]]; then echo "install folder still present"; ls -la "$app"; exit 1; fi
          [[ ! -e "$lnk" ]] || { echo "shortcut left behind"; exit 1; }
          echo "uninstalled cleanly"

      - name: Upload CallXL-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: CallXL-Setup
          path: target/installer/CallXL-Setup.exe
          if-no-files-found: error

      - name: Upload Windows e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-windows
          path: |
            target/e2e-artifacts
            install.log
            !target/**/assets
          if-no-files-found: warn

