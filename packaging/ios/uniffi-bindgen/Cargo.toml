# Host-only UniFFI bindgen for the iOS build (packaging/ios/build-xcframework.sh).
# Standalone (own lockfile, own target dir) so generating Swift bindings on macOS does
# not need a host build of callxl-core and its libwebrtc. The uniffi version must match
# crates/core exactly (the metadata format is version-specific).
[package]
name = "callxl-uniffi-bindgen"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "=0.29.5", features = ["cli"] }

[workspace]
