[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/media",
    "crates/signal",
    "crates/lan",
    "crates/cli",
    "tests/e2e",
]
exclude = ["third_party/webrtc-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/user99672223/CallXL"
rust-version = "1.97"
publish = false

[workspace.dependencies]
callxl-core = { path = "crates/core" }
callxl-media = { path = "crates/media" }
callxl-signal = { path = "crates/signal" }
callxl-lan = { path = "crates/lan" }
webrtc-sys = { path = "third_party/webrtc-sys" }
cxx = "1.0"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
base64 = "0.22"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
webrtc-sys = { path = "third_party/webrtc-sys" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Tests and the e2e harness run the debug profile; keep libwebrtc-adjacent code reasonably fast.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
