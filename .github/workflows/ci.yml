# ci — every push, pull request and manual run.
#
# Jobs (parallel unless noted):
#   lint     cargo fmt --check + clippy -D warnings
#   swift-bindgen  UniFFI Swift bindings generate from the Linux cdylib
#   worker   Cloudflare Worker vitest suite
#   linux    _build-linux.yml (build): debug binaries, unit tests; uploads e2e-bins
#   linux-package  _build-linux.yml (package): desktop release build, .deb, install, < 1 s launch
#   e2e      (needs linux) fast e2e suites, one job each, on the prebuilt binaries; the
#            loopback suite also runs the PulseAudio null-sink (platform ADM) case and
#            the desktop gui_join (GUI joins a CLI peer over mDNS under Xvfb)
#   netem    (needs linux) _netem-matrix.yml: the six §11 tc-netem scenarios in parallel
#   windows  _build-windows.yml   (CallXL-Setup.exe)
#   macos    _build-macos.yml     (CallXLCore.xcframework, Simulator tests, CallXL-unsigned.ipa)
# Artifacts: e2e-bins, linux-deb, windows-installer, ios-ipa, e2e-<suite>, netem-<scenario>.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CC: clang-21
  CXX: clang++-21

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: lint
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  swift-bindgen:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: bindgen
      - name: Swift bindings generate on Linux (UniFFI)
        run: |
          set -euo pipefail
          cargo rustc -p callxl-core --lib --crate-type cdylib
          cargo run -q -p callxl-core --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/libcallxl_core.so --language swift --out-dir target/swift-bindings
          ls -l target/swift-bindings
          test -s target/swift-bindings/CallXLCore.swift
          test -s target/swift-bindings/CallXLCoreFFI.h
          test -s target/swift-bindings/CallXLCoreFFI.modulemap

  worker:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/worker/package-lock.json
      - name: Worker tests (vitest)
        run: |
          npm ci
          npm test

  linux:
    uses: ./.github/workflows/_build-linux.yml
    with:
      upload_artifacts: true
      package: false

  linux-package:
    uses: ./.github/workflows/_build-linux.yml
    with:
      upload_artifacts: true
      build_tests: false

  e2e:
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: loopback, skip: "" }
          - { suite: signaling, skip: "" }
          - { suite: diagnostics, skip: "" }
          # file_transfer_throttle_keeps_audio_loss_flat is the netem file_throttle scenario.
          - { suite: chat_files, skip: "--skip file_transfer_throttle_keeps_audio_loss_flat" }
    name: e2e ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux.outputs.bins_artifact }}
          path: dist/e2e-bins

      - uses: actions/setup-node@v4
        if: matrix.suite == 'signaling'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/worker/package-lock.json

      - name: Local Worker for signaling_roundtrip_wrangler
        if: matrix.suite == 'signaling'
        working-directory: infra/worker
        run: npm ci

      - name: e2e ${{ matrix.suite }} (tc netem on lo, as root)
        env:
          CALLXL_NETEM: tc
          CALLXL_CLI: ${{ github.workspace }}/dist/e2e-bins/callxl-cli
          CALLXL_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
          TEST_BIN: dist/e2e-bins/${{ matrix.suite }}
          SKIP: ${{ matrix.skip }}
        run: |
          set -euo pipefail
          chmod +x dist/e2e-bins/*
          ip -6 addr show dev lo
          sudo ip link set lo multicast on
          status=0
          # shellcheck disable=SC2086
          sudo -E env PATH="$PATH" "$TEST_BIN" $SKIP --test-threads=1 --nocapture || status=$?
          sudo chown -R "$(id -u):$(id -g)" e2e-artifacts || true
          exit "$status"

      - name: PulseAudio null sink exercised once (platform ADM)
        if: matrix.suite == 'loopback'
        env:
          CALLXL_E2E_ADM: platform
          CALLXL_CLI: ${{ github.workspace }}/dist/e2e-bins/callxl-cli
          CALLXL_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts-pulse
        run: |
          set -euo pipefail
          sudo apt-get install -y -q --no-install-recommends pulseaudio pulseaudio-utils >/dev/null
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=callxl_null
          pactl set-default-sink callxl_null
          pactl set-default-source callxl_null.monitor
          # Speech into the null sink so the platform capture (its monitor) is not silence:
          # with silence VBR Opus sends ~2 kbps and BWE has nothing to grow on (run 42337000540).
          wav="$(find e2e-artifacts/assets -name '*.wav' | head -1)"
          ( while true; do paplay -d callxl_null "$wav" || break; done ) &
          player=$!
          dist/e2e-bins/loopback loopback_v4_lan_policy --exact --nocapture
          kill "$player" || true

      - name: Desktop gui_join (GUI joins a callxl-cli peer over real mDNS, under Xvfb)
        if: matrix.suite == 'loopback' && hashFiles('apps/desktop/tests/gui_join.sh') != ''
        env:
          CALLXL_GUI_JOIN_AUDIO: "1"
          CALLXL_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts-gui
        run: |
          set -euo pipefail
          sudo apt-get install -y -q --no-install-recommends xvfb xauth libxkbcommon-x11-0 libxkbcommon0 libgl1 libegl1 \
            libgl1-mesa-dri libfontconfig1 libxcursor1 libxi6 libxrandr2 libwayland-client0 libwayland-egl1 libwayland-cursor0 bc >/dev/null
          # PulseAudio (started above) gives the GUI's platform audio device a null sink;
          # speech into it so the GUI sends real audio back to the CLI peer.
          wav="$(find e2e-artifacts/assets -name '*.wav' | head -1)"
          ( while true; do paplay -d callxl_null "$wav" || break; done ) &
          player=$!
          mkdir -p "$CALLXL_E2E_ARTIFACTS"
          apps/desktop/tests/gui_join.sh dist/e2e-bins/callxl dist/e2e-bins/callxl-cli | tee "$CALLXL_E2E_ARTIFACTS/gui_join.txt"
          kill "$player" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.suite }}
          path: |
            e2e-artifacts
            e2e-artifacts-pulse
            e2e-artifacts-gui
            !**/assets
          retention-days: 14
          if-no-files-found: warn

  netem:
    needs: linux
    uses: ./.github/workflows/_netem-matrix.yml
    with:
      ref: ${{ github.sha }}
      bins_artifact: ${{ needs.linux.outputs.bins_artifact }}

  windows:
    uses: ./.github/workflows/_build-windows.yml
    with:
      upload_artifacts: true

  macos:
    uses: ./.github/workflows/_build-macos.yml
    with:
      upload_artifacts: true
